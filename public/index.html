<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B1E3F">
<title>Коннект — найди свою компанию</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bordo:#8B1E3F; --bordo-d:#5E1229; --bordo-x:#3A0B1B; --rose:#B23A5E; --pink:#F4C2CF; --pink-d:#E8A5B5;
  --cream:#FFF4EC; --card:#FFFBF7; --line:#EBD3CC; --ink:#3A2630; --soft:#6B4A55; --ok:#2F7D5B;
  --bg:#FBF1E9; --glass:rgba(255,244,236,.82); --field:#fff;
  --r:20px; --shadow:0 10px 30px rgba(94,18,41,.09); --shadow-l:0 18px 44px rgba(94,18,41,.16);
  --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bordo:#A3274C; --bordo-d:#3A0B1B; --bordo-x:#220811; --rose:#D07A93; --pink:#5A3140; --pink-d:#7A4659;
  --cream:#1A1316; --card:#241A1F; --line:#3E2B33; --ink:#F3E8E4; --soft:#C3AEB4; --ok:#3A8A68;
  --bg:#150F12; --glass:rgba(26,19,22,.84); --field:#1E1619;
  --shadow:0 10px 30px rgba(0,0,0,.28); --shadow-l:0 18px 44px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:10px}
h1,h2{font-family:var(--serif);font-weight:600;color:var(--bordo);letter-spacing:.2px}
:root[data-theme=dark] h1,:root[data-theme=dark] h2{color:#F3D9DF}
h1{font-size:40px;line-height:1.05}
h2{font-size:28px;line-height:1.1}
h3{font-size:16px;font-weight:700;line-height:1.3}
.sub{color:var(--soft);font-size:14px;margin-top:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--rose)}
.rule{display:inline-block;width:46px;height:1px;background:var(--pink-d);vertical-align:middle;margin-left:12px}

[hidden]{display:none!important}
body:not(.guest) .demo{display:none}
/* strip */
.demo{background:var(--bordo-x);color:var(--pink);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;text-align:center;padding:7px 12px}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 30px)}
body.guest .shell{display:block}
body.guest .side,body.guest .top,body.guest .bottom{display:none!important}
.side{position:sticky;top:0;height:100vh;align-self:start;background:linear-gradient(185deg,#6B1632 0%,#4A0F25 55%,#33091A 100%);color:var(--cream);padding:30px 18px 24px;display:flex;flex-direction:column;gap:26px;overflow:hidden}
.side::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 300px at 110% 105%,rgba(244,194,207,.16),transparent 70%),repeating-linear-gradient(115deg,rgba(255,244,236,.025) 0 1px,transparent 1px 22px);pointer-events:none}
.side>*{position:relative}
.logo{display:flex;align-items:center;gap:12px;padding:0 10px;cursor:pointer;user-select:none}
.logo svg{width:38px;height:38px;flex:none}
.logo span{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--cream)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--pink);position:relative;text-align:left;transition:.2s}
.nav button:hover{background:rgba(255,244,236,.09);color:var(--cream)}
.nav button.on{background:linear-gradient(95deg,var(--pink),var(--cream));color:var(--bordo-d);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.badge{background:var(--pink);color:var(--bordo-d);font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.side-foot .btn{width:100%}
.motto{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.25;color:var(--pink-d);padding:0 10px;border-top:1px solid rgba(244,194,207,.2);padding-top:16px}

/* top bar */
.content{min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 32px}
.top .logo{display:none}
.gsearch{flex:1;max-width:520px;position:relative}
.gsearch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft)}
.gsearch input[type=text]{width:100%;padding:12px 18px 12px 46px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px}
.spacer{flex:1}
.theme-toggle{display:inline-flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--field);font-size:15px}
.theme-toggle span{width:32px;height:30px;display:grid;place-items:center;border-radius:999px;color:var(--soft)}
.theme-toggle span.act{background:linear-gradient(135deg,var(--bordo),var(--rose));color:#fff}
.bellwrap{position:relative}
.bell{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;color:var(--bordo);position:relative}
:root[data-theme=dark] .bell{color:#F3D9DF}
.bell:hover{border-color:var(--rose)}
.bell .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--bordo);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.panel{position:absolute;right:0;top:54px;width:min(380px,92vw);max-height:min(70vh,520px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-l);z-index:40}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.panel-h h3{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--bordo)}
.note-i{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px}
.note-i:last-child{border-bottom:0}
.note-i.un{background:rgba(244,194,207,.22)}
.note-i .ico{width:36px;height:36px;border-radius:12px;background:var(--pink);color:var(--bordo-d);display:grid;place-items:center;flex:none}
.note-i b{display:block;font-size:13px;line-height:1.3;white-space:pre-line}
.note-i small{color:var(--soft);font-size:11px}
.me{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink-d));color:var(--bordo-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:2px solid var(--card)}
.verified{display:block;font-size:11px;color:var(--soft);font-weight:500}

main{max-width:1280px;margin:0 auto;padding:30px 32px 120px}
body.guest main{max-width:1180px;padding:28px 20px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.2px;background:linear-gradient(135deg,var(--bordo),#6F1832);color:#FFF4EC;transition:.2s;box-shadow:0 8px 20px rgba(94,18,41,.22)}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(94,18,41,.3)}
.btn.ghost{background:transparent;color:var(--bordo);box-shadow:inset 0 0 0 1.5px var(--bordo)}
.btn.ghost:hover{background:var(--pink);box-shadow:inset 0 0 0 1.5px var(--bordo)}
:root[data-theme=dark] .btn.ghost{color:#F3C9D3;box-shadow:inset 0 0 0 1.5px #8E5266}
.btn.soft{background:var(--pink);color:var(--bordo-d);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#2F7D5B,#256349)}
.btn.sm{padding:8px 16px;font-size:13px}
.btn.light{background:var(--cream);color:var(--bordo-d)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* forms */
label{font-size:12px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;gap:7px;letter-spacing:.3px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--field);font-size:15px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(178,58,94,.12)}
.form{padding:34px;display:flex;flex-direction:column;gap:16px}
.note{font-size:12px;color:var(--soft)}
.err{color:#B3261E;font-size:12px;font-weight:600}
:root[data-theme=dark] .err{color:#FF8A80}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* login */
.login{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;min-height:calc(100vh - 120px)}
.hero{background:linear-gradient(150deg,#7A1A38,#4A0F25 70%);color:var(--cream);border-radius:32px;padding:52px;position:relative;overflow:hidden;min-height:520px;display:flex;flex-direction:column;justify-content:center;gap:20px;box-shadow:var(--shadow-l)}
.hero h1{color:var(--cream);font-size:62px;font-weight:500}
.hero p{color:var(--pink);font-size:17px;max-width:420px}
.hero .circle{position:absolute;right:-110px;bottom:-110px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#B23A5E,#7A1A38);opacity:.55}
.hero svg.rocket{position:absolute;right:34px;bottom:26px;width:170px;height:227px}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;gap:18px;max-width:62%}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--pink);color:var(--bordo-d);font-weight:700;border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.3px;display:inline-block}
.pill.cream{background:var(--cream);color:var(--bordo)}

/* feed hero */
.banner{position:relative;overflow:hidden;border-radius:28px;padding:44px 48px;background:linear-gradient(120deg,#7A1A38 0%,#5E1229 55%,#3A0B1B 100%);color:var(--cream);box-shadow:var(--shadow-l);margin-bottom:26px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 320px at 92% 10%,rgba(244,194,207,.28),transparent 65%),repeating-linear-gradient(115deg,rgba(255,244,236,.035) 0 1px,transparent 1px 26px)}
.banner>*{position:relative}
.banner .eyebrow{color:var(--pink)}
.banner h1{color:var(--cream);font-size:50px;font-weight:500;max-width:620px}
.banner p{color:var(--pink);font-size:17px;font-family:var(--serif);font-style:italic}
.banner .btns{margin-top:8px}
.banner .demo-note{font-family:'Montserrat',sans-serif;font-style:normal;font-size:12px;color:var(--pink-d);opacity:.9}
.dtag{position:absolute;left:14px;bottom:12px;background:rgba(58,11,27,.78);color:#F4C2CF;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.banner svg.art{position:absolute;right:46px;top:50%;transform:translateY(-50%);width:150px;opacity:.95}
.banner .btn.ghost{color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(244,194,207,.6)}
.banner .btn.ghost:hover{background:rgba(255,244,236,.12)}

/* tabs */
.tabs{display:inline-flex;gap:4px;padding:5px;background:var(--glass);border:1px solid var(--line);border-radius:999px;margin-bottom:24px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 22px;border-radius:999px;font-weight:600;font-size:14px;color:var(--soft);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button{flex:none}
.tabs button.on{background:linear-gradient(135deg,var(--bordo),#6F1832);color:#FFF4EC;box-shadow:0 6px 16px rgba(94,18,41,.25)}

/* feed */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.feed-columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:26px;align-items:start}
.feed-stack{display:flex;flex-direction:column;gap:18px}
.feed-post{padding:26px;display:flex;flex-direction:column;gap:10px}
.feed-post p{font-size:14px;color:var(--soft);white-space:pre-wrap}
.feed-post h3{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--bordo)}
:root[data-theme=dark] .feed-post h3{color:#F3D9DF}
.feed-meta{font-size:12px;color:var(--soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft)}
.search input[type=text]{padding-left:46px;border-radius:999px}
.tools select{width:auto;border-radius:999px;font-weight:600;font-size:14px;padding:12px 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--rose)}
.chip.on{background:var(--bordo-d);border-color:var(--bordo-d);color:var(--cream)}
:root[data-theme=dark] .chip.on{background:#EAD8D0;color:#35131F}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.ev{overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer;position:relative}
.ev:hover{transform:translateY(-4px);box-shadow:var(--shadow-l);border-color:var(--pink-d)}
.cover{height:140px;display:grid;place-items:center;position:relative}
.cover svg.i{width:48px;height:48px;stroke-width:1.4}
.tag{position:absolute;left:14px;top:14px;background:rgba(255,244,236,.94);color:var(--bordo);font-size:11px;font-weight:700;letter-spacing:.5px;border-radius:999px;padding:5px 13px}
.fav{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,244,236,.94);color:var(--bordo);display:grid;place-items:center;z-index:2}
.fav.on svg{fill:var(--bordo)}
.ev-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.ev-b h3{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15;color:var(--bordo)}
:root[data-theme=dark] .ev-b h3{color:#F3D9DF}
.meta{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.meta div{display:flex;gap:9px;align-items:center}
.ev-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.host{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.host .ava{width:30px;height:30px;font-size:11px}
.spots{font-size:12px;font-weight:700;color:var(--rose)}
.more{font-size:12px;font-weight:700;color:var(--rose);display:flex;gap:4px;align-items:center}
.empty{text-align:center;padding:60px 20px;color:var(--soft)}

/* aside blocks */
.aside-card{padding:22px}
.aside-card h2{font-size:24px;margin-bottom:4px}
.li{display:flex;gap:12px;align-items:center;padding:12px 8px;text-align:left;width:100%;border-radius:14px;cursor:pointer}
.li:hover{background:rgba(244,194,207,.25)}
.li.on{background:var(--pink)}
.li b{font-size:14px;display:block;line-height:1.25}
.li small{color:var(--soft);font-size:12px}
.li .ava{width:44px;height:44px;border-radius:14px}
.datebox{width:52px;height:56px;border-radius:14px;background:var(--pink);color:var(--bordo-d);display:grid;place-items:center;text-align:center;flex:none;line-height:1}
.datebox b{font-family:var(--serif);font-size:24px;font-weight:700}
.datebox small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--bordo-d)}
.cta-card{padding:26px;background:linear-gradient(150deg,#7A1A38,#4A0F25);color:var(--cream);border:0;position:relative;overflow:hidden}
.cta-card h2{color:var(--cream)}.cta-card p{color:var(--pink);font-size:14px}
.cta-card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(244,194,207,.14)}
.cta-card>*{position:relative;z-index:1}

/* community */
.community-grid,.recommend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.community-card{padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.25s}
.community-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-l);border-color:var(--pink-d)}
.community-card h3{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--bordo);margin-top:10px}
:root[data-theme=dark] .community-card h3{color:#F3D9DF}
.community-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--pink-d));color:var(--bordo-d);display:grid;place-items:center}
.community-card p{font-size:13px;color:var(--soft);flex:1}
.tagrow{display:flex;gap:7px;flex-wrap:wrap}
.tagrow span,.profile-tag{background:var(--pink);color:var(--bordo-d);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
:root[data-theme=dark] .tagrow span,:root[data-theme=dark] .profile-tag{color:#F3D9DF}
.cdetail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:24px;align-items:start}
.cdetail .cover-l{height:200px;border-radius:24px;background:linear-gradient(130deg,#7A1A38,#4A0F25);display:grid;place-items:center;color:var(--pink);margin-bottom:22px;position:relative;overflow:hidden}
.cdetail .cover-l svg.i{width:80px;height:80px;stroke-width:1.2}
.cdetail .cover-l::after{content:"";position:absolute;right:-50px;top:-50px;width:220px;height:220px;border-radius:50%;background:rgba(244,194,207,.14)}
.cdetail h1{margin:12px 0 14px}
.cdetail p.lead{font-size:16px;line-height:1.7;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.fact{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.fact b{font-family:var(--serif);font-size:28px;color:var(--bordo);display:block;line-height:1}
:root[data-theme=dark] .fact b{color:#F3D9DF}
.fact span{font-size:11px;color:var(--soft);font-weight:600;letter-spacing:.5px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--bordo);margin-bottom:18px;font-size:14px}
:root[data-theme=dark] .back{color:#F3C9D3}

/* event + chat */
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.big-cover{height:220px;border-radius:24px;display:grid;place-items:center;margin-bottom:20px;box-shadow:var(--shadow)}
.big-cover svg.i{width:76px;height:76px;stroke-width:1.3}
.chat{display:flex;flex-direction:column;height:580px;overflow:hidden}
.chat-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.m{max-width:80%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:var(--pink);font-size:14px;color:var(--bordo-d)}
:root[data-theme=dark] .m{color:var(--ink)}
.m small{display:block;font-weight:700;color:var(--rose);font-size:11px;margin-bottom:2px}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--bordo),#6F1832);color:var(--cream);border-radius:18px 18px 4px 18px}
.m.me small{color:var(--pink)}
.send{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.send input{border-radius:999px}.send .btn{padding:0 20px}
.chats{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.list{display:flex;flex-direction:column;overflow:hidden;padding:10px}
.mdel{margin-left:6px;color:inherit;opacity:.7;font-size:15px;line-height:1;padding:0 4px}
.mdel:hover{opacity:1}

/* create */
.create{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start}
.preview-t{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--rose);margin-bottom:12px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.stat{padding:22px}
.stat b{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--bordo);display:block;line-height:1}
:root[data-theme=dark] .stat b{color:#F3D9DF}
.stat span{font-size:13px;color:var(--soft)}
.q{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .grow{flex:1;min-width:0}
.q small{color:var(--soft);font-size:12px;display:block}
.ticket{width:64px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--pink-d));display:grid;place-items:center;color:var(--bordo-d);font-size:10px;font-weight:800;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* profile */
.profile-layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:24px;align-items:start}
.profile-summary{padding:30px;display:flex;flex-direction:column;gap:16px}
.profile-person{display:flex;align-items:center;gap:16px}
.profile-person .ava{width:76px;height:76px;font-size:24px;border-width:3px}
.profile-person h2{font-size:30px;line-height:1.1}
.profile-muted{font-size:13px;color:var(--soft)}
.profile-section{padding:18px 0 0;border-top:1px solid var(--line)}
.profile-section h3{margin-bottom:8px;color:var(--bordo);font-size:13px;letter-spacing:2px;text-transform:uppercase}
:root[data-theme=dark] .profile-section h3{color:#F3C9D3}
.profile-tags{display:flex;gap:7px;flex-wrap:wrap}
.profile-form,.settings-card{padding:30px;display:flex;flex-direction:column;gap:16px}
.profile-form textarea{resize:vertical;min-height:88px}
.profile-empty{font-size:13px;color:var(--soft)}
.check-row{display:flex;flex-direction:row;align-items:center;gap:12px;font-weight:600;color:var(--ink);font-size:14px;letter-spacing:0}
.check-row input{width:18px;height:18px;accent-color:var(--bordo)}
.week-h,.week{display:none}
.section-block{margin-top:28px}
.page-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--bordo-x);color:var(--cream);padding:13px 24px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center;box-shadow:var(--shadow-l)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(40,12,22,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:80;padding:16px}
.dlg{width:min(380px,100%);padding:26px;display:flex;flex-direction:column;gap:12px}

.bottom{display:none}
@media (max-width:1100px){
  .feed-columns,.cdetail{grid-template-columns:1fr}
}
@media (max-width:1000px){
  .shell{display:block}
  .side{display:none}
  .top .logo{display:flex}
  .top .logo span{font-size:20px;letter-spacing:3px;color:var(--bordo)}
  :root[data-theme=dark] .top .logo span{color:#F3D9DF}
  .gsearch{display:none}
  .top-in{padding:10px 16px;gap:10px}
  .me .nm,.me .btn{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:10px;font-weight:700;color:var(--soft);position:relative;border-radius:14px}
  .bottom button.on{color:var(--bordo-d);background:var(--pink)}
  .bottom .badge{position:absolute;top:0;right:18%;margin:0}
  .bottom svg.i{width:20px;height:20px}
  main{padding:20px 16px 120px}
  .login,.two,.create,.chats,.profile-layout{grid-template-columns:1fr}
  .hero{min-height:400px;padding:32px}.hero h1{font-size:44px}.hero-in{max-width:100%}.hero svg.rocket{display:none}
  .tabs{display:flex;width:100%}.tabs button{padding:10px 16px}
  .banner{padding:30px 24px;min-height:200px}.banner h1{font-size:36px}.banner svg.art{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row2{grid-template-columns:1fr}
  .form,.profile-form,.settings-card,.profile-summary{padding:22px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{font-size:16px;min-height:48px}
  .tools select{width:100%;flex:1 1 140px}
  .btn{min-height:46px}.btn.sm{min-height:44px}
  .q{flex-wrap:wrap}.q .btns{width:100%}
  .chat{height:min(540px,70vh)}
  .big-cover{height:160px}
  h1{font-size:32px}h2{font-size:25px}
  .toast{bottom:90px}
  .facts{grid-template-columns:repeat(3,1fr)}
  .panel{position:fixed;left:12px;right:12px;top:64px;width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

 if(reloginP)return reloginP;

function filtered(){

  if(S.cat!=='all'&&e.cat!==S.cat)return false;
  if(S.q&&(e.title+' '+e.place).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
  if(S.course!=='0'&&String(e.course)!==S.course)return false;
  var diff=Math.round((new Date(e.when.getFullYear(),e.when.getMonth(),e.when.getDate())-base)/86400000);
  if(S.date==='today'&&diff!==0)return false;

function chatPane(key,title){

function curKey(){
 if(S.view==='chats')return S.chat;
 if(S.view==='event'){var e=ev(S.sel);if(e&&(e.joined||isMod()))return e.id;}
 return null;
}
function fetchChat(key,force){
 if(key==null)return Promise.resolve();
 var c=C[key]=C[key]||{l:[],last:0};
 return api('GET','/api/chats/'+key+'/messages?after='+c.last).then(function(d){
  var add=d.messages.filter(function(m){return m.id>c.last;});
  if(add.length){add.forEach(function(m){c.l.push(m);c.last=Math.max(c.last,m.id);});}
  if(add.length||force)paintMsgs(key,force);
 });
}
function paintMsgs(key,stick){
 if(curKey()!==key)return;
 var el=document.getElementById('msgs');if(!el)return;
 var n=((C[key]||{}).l||[]).length;
 if(!stick&&el.dataset.n===String(n))return;
 var near=el.scrollHeight-el.scrollTop-el.clientHeight<80;
 el.innerHTML=msgsHtml(key);el.dataset.n=String(n);
 if(stick||near)el.scrollTop=el.scrollHeight;
}
function profileTags(value){

 return items.length?'<div class="profile-tags">'+items.map(function(x){return '<span class="profile-tag">'+esc(x)+'</span>';}).join('')+'</div>':'<p class="profile-empty">Пока не заполнено</p>';
}

/* ---------- render ---------- */
function render(keep){
 var app=document.getElementById('app'),y=window.scrollY;
 var v=S.user?S.view:'login';if(v==='admin'&&!isMod())v=S.view='feed';
 app.innerHTML=v==='login'?vLogin():v==='feed'?vFeed():v==='recommendations'?vRecommendations():v==='communities'?vCommunities():v==='community'?vCommunity():v==='profile'?vProfile():v==='event'?vEvent():v==='chats'?vChats():v==='create'?vCreate():v==='archive'?vArchive():vAdmin();
 chrome();showStats();
 if(v==='create')bindCreate();
 var m=document.getElementById('msgs');if(m){var k=curKey();m.dataset.n=String(((C[k]||{}).l||[]).length);m.scrollTop=m.scrollHeight;if(k!=null)fetchChat(k).catch(function(){});}
 window.scrollTo(0,keep?y:0);
}
function go(v){
 if(v==='recommendations'){v='feed';S.tab='foryou';}
 S.view=v;
 if(v==='admin'){S.ov=null;render();loadAdmin();return;}
 if(v==='archive'){S.arch=null;render();api('GET','/api/archive').then(function(d){S.arch=normEvents(d.events);if(S.view==='archive')render(true);}).catch(fail);return;}
 render();
 if(v==='feed'||v==='recommendations')loadFeed().then(function(){if(S.view===v)render(true);}).catch(fail);
 if(v==='feed'&&S.tab==='events'){}
 if(v==='communities')loadCommunities().then(function(){if(S.view===v)render(true);}).catch(fail);
 if(v==='chats')loadEvents().then(function(ch){if(ch&&S.view===v)render(true);}).catch(fail);
}
function loadAdmin(){return api('GET','/api/mod/overview').then(function(d){S.ov=d;if(S.view==='admin')render(true);else chrome();}).catch(fail);}

/* ---------- create form ---------- */
function bindCreate(){
 var f=document.getElementById('cForm');
 function up(){document.getElementById('prev').innerHTML=previewCard();}
 f.addEventListener('input',up);f.addEventListener('change',up);up();
 f.addEventListener('submit',function(x){
  x.preventDefault();
  var t=document.getElementById('cTitle').value.trim(),pl=document.getElementById('cPlace').value.trim(),er=document.getElementById('cErr');
  var dt=document.getElementById('cDate').value,tm=document.getElementById('cTime').value,n=+document.getElementById('cN').value;
  if(!t||!pl||!dt||!tm||!(n>=1)){er.textContent='Заполните название, дату, время, место и число участников.';return;}
  var w=new Date(dt+'T'+tm);
  var btn=document.getElementById('cBtn');btn.disabled=true;
  api('POST','/api/events',{cat:document.getElementById('cCat').value,title:t,place:pl,when:w.toISOString(),total:n+1,desc:document.getElementById('cDesc').value.trim()}).then(function(){
   S.cat='all';S.q='';S.course='0';S.date='any';
   return loadEvents();
  }).then(function(){S.view='feed';render();toast('Приглашение опубликовано. Его уже видят все.');loadStats();}).catch(function(e){btn.disabled=false;er.textContent=e.message;});
 });
}

 document.body.appendChild(o);document.getElementById('modCode').focus();
 document.getElementById('modCancel').onclick=function(){o.remove();};
 o.addEventListener('mousedown',function(e){if(e.target===o)o.remove();});

  e.preventDefault();
  api('POST','/api/mod/claim',{code:document.getElementById('modCode').value}).then(function(d){S.user=d.user;o.remove();toast('Вы теперь модератор');go('admin');}).catch(function(er){document.getElementById('modErr').textContent=er.message;});
 };

 if(t.classList&&t.classList.contains('logo')){if(logoTap())return;if(S.user)go('feed');return;}
 if(t.dataset.go){if(t.dataset.tab)S.tab=t.dataset.tab;S.bellOpen=false;go(t.dataset.go);return;}
 if(t.hasAttribute('data-community-open')&&!t.hasAttribute('data-community-join')){S.cid=+t.dataset.communityOpen;S.cdetail=null;S.view='community';render();api('GET','/api/communities/'+S.cid).then(function(d){if(S.view==='community'&&S.cid===d.community.id){S.cdetail=d;render(true);}}).catch(fail);return;}
 if(t.hasAttribute('data-community-join')){var cid=+t.dataset.communityJoin;api('POST','/api/communities/'+cid+'/join',{}).then(function(){if(S.view==='community')return api('GET','/api/communities/'+cid).then(function(d){S.cdetail=d;});return loadCommunities();}).then(function(){render(true);toast('Готово');loadFeed().catch(function(){});}).catch(fail);return;}
 if(t.hasAttribute('data-tg-link')){api('POST','/api/telegram/link',{}).then(function(d){if(window.CONNECT_TELEGRAM&&window.CONNECT_TELEGRAM.openTelegramLink)window.CONNECT_TELEGRAM.openTelegramLink(d.url);else window.open(d.url,'_blank','noopener');toast('Нажмите Start в открывшемся боте, затем вернитесь и обновите статус');}).catch(fail);return;}
 if(t.hasAttribute('data-tg-refresh')){api('GET','/api/me').then(function(d){S.user=d.user;render(true);toast('Статус Telegram обновлён');}).catch(fail);return;}
 if(t.hasAttribute('data-tg-unlink')){api('POST','/api/telegram/unlink',{}).then(function(d){S.user=d.user;render(true);toast('Telegram отключён');}).catch(fail);return;}
 if(t.dataset.cat){S.cat=t.dataset.cat;render(true);return;}
 if(t.dataset.open){S.sel=+t.dataset.open;S.view='event';render();return;}
 if(t.dataset.join){
  var id=+t.dataset.join;
  api('POST','/api/events/'+id+'/join').then(function(d){
   var i=events.map(function(e){return e.id;}).indexOf(id);d.event.when=new Date(d.event.when);if(i>=0)events[i]=d.event;evSig='';
   toast(d.event.joined?'Вы в списке! Чат встречи доступен в разделе «Чаты».':'Вы отменили участие');render(true);loadStats();
  }).catch(function(er){fail(er);loadEvents().then(function(){render(true);}).catch(function(){});});
  return;
 }
 if(t.dataset.fav){var f=+t.dataset.fav;if(!f)return;S.fav[f]=!S.fav[f];render(true);return;}
 if(t.dataset.report){api('POST','/api/events/'+t.dataset.report+'/report',{text:'Жалоба на содержание события'}).then(function(){toast('Жалоба отправлена модератору');}).catch(fail);return;}
 if(t.dataset.chatOpen){S.chat=t.dataset.chatOpen==='general'?'general':+t.dataset.chatOpen;render(true);return;}
 if(t.dataset.delev){
  if(!confirm('Убрать встречу в архив? Модератор сможет её вернуть.'))return;
  api('DELETE','/api/events/'+t.dataset.delev).then(function(){evSig='';return loadEvents();}).then(function(){if(S.view==='event')S.view='feed';toast('Встреча убрана в архив');if(isMod()&&S.view==='admin')return loadAdmin();render(true);loadStats();}).catch(fail);
  return;
 }
 if(t.dataset.deluser){
  if(!confirm('Отправить аккаунт в архив? Войти он не сможет, но вы сможете его вернуть.'))return;
  api('DELETE','/api/users/'+t.dataset.deluser).then(function(){toast('Аккаунт в архиве');loadStats();return loadAdmin();}).catch(fail);return;
 }
 if(t.dataset.restev){api('POST','/api/events/'+t.dataset.restev+'/restore').then(function(){toast('Встреча возвращена');evSig='';return loadEvents();}).then(loadAdmin).catch(fail);return;}
 if(t.dataset.restuser){api('POST','/api/users/'+t.dataset.restuser+'/restore').then(function(){toast('Аккаунт возвращён');loadStats();return loadAdmin();}).catch(fail);return;}
 if(t.dataset.delrep){api('DELETE','/api/reports/'+t.dataset.delrep).then(function(){toast('Жалоба закрыта');return loadAdmin();}).catch(fail);return;}
 if(t.dataset.delmsg){
  api('DELETE','/api/messages/'+t.dataset.delmsg).then(function(){
   var id=+t.dataset.delmsg;Object.keys(C).forEach(function(k){C[k].l=C[k].l.filter(function(m){return m.id!==id;});});
   var k=curKey();if(k!=null)paintMsgs(k,false);var el=document.getElementById('msgs');if(el)el.dataset.n='-1';if(k!=null)paintMsgs(k,false);toast('Сообщение удалено');
  }).catch(fail);return;
 }
 if(t.dataset.act==='bell'){S.bellOpen=!S.bellOpen;if(S.bellOpen){chrome();if(S.notes.unread){api('POST','/api/notifications/read',{}).then(function(){S.notes.unread=0;chrome();}).catch(function(){});}}else{S.notes.items.forEach(function(n){n.read=true;});chrome();}return;}
 if(t.dataset.act==='week'){S.weekOpen=!S.weekOpen;try{localStorage.setItem('connect_week',S.weekOpen?'1':'0');}catch(e){}render(true);return;}
 if(t.dataset.act==='logout'){setIdent(null);S.bellOpen=false;S.notes={items:[],unread:0};S.user=null;S.ov=null;events=[];evSig='';C={};setTok('');S.view='login';render();loadStats();return;}
});
document.addEventListener('keydown',function(x){if(x.key==='Enter'&&x.target.id==='communityQ'){S.communityQ=x.target.value;loadCommunities().then(function(){render(true);}).catch(fail);return;}if(x.key==='Enter'&&x.target.id==='gSearch'){S.q=x.target.value;S.tab='events';S.cat='all';go('feed');return;}if((x.key==='Enter'||x.key===' ')&&x.target.classList&&x.target.classList.contains('logo')){x.preventDefault();x.target.click();return;}if(x.key==='Enter'&&x.target.matches&&x.target.matches('[data-open],[data-community-open]')&&x.target===document.activeElement){x.preventDefault();x.target.click();}});
document.addEventListener('input',function(x){
 if(x.target.id==='communityQ'){S.communityQ=x.target.value;return;}
 if(x.target.id==='fQ'){S.q=x.target.value;var pos=x.target.selectionStart;render(true);var q=document.getElementById('fQ');q.focus();q.setSelectionRange(pos,pos);}
});
document.addEventListener('change',function(x){
 var i=x.target.id;
 if(i==='fCourse'){S.course=x.target.value;render(true);}
 else if(i==='fDate'){S.date=x.target.value;render(true);}
});
document.addEventListener('submit',function(x){
 var f=x.target;
 if(f.id==='profileForm'){
  x.preventDefault();
  var er=document.getElementById('pErr'),btn=document.getElementById('pSave');
  var payload={
   name:document.getElementById('pName').value.trim(),
   fac:document.getElementById('pFac').value.trim(),
   course:+document.getElementById('pCourse').value,
   about:document.getElementById('pAbout').value.trim(),
   interests:document.getElementById('pInterests').value.trim(),
   skills:document.getElementById('pSkills').value.trim(),
   achievements:document.getElementById('pAchievements').value.trim()
  };
  if(!payload.name){er.textContent='Укажите имя.';return;}
  btn.disabled=true;er.textContent='';
  api('POST','/api/me/profile',payload).then(function(d){
   S.user=d.user;render(true);toast('Профиль сохранён');
  }).catch(function(e){btn.disabled=false;er.textContent=e.message;});
  return;
 }
 if(f.id==='notificationForm'){
  x.preventDefault();var prefs={events:document.getElementById('nEvents').checked,news:document.getElementById('nNews').checked,chats:document.getElementById('nChats').checked,reminders:document.getElementById('nReminders').checked};
  api('POST','/api/me/notifications',prefs).then(function(d){S.user=d.user;toast('Настройки уведомлений сохранены');}).catch(fail);return;
 }
 if(f.id==='communityForm'){
  x.preventDefault();var er=document.getElementById('communityErr');
  api('POST','/api/communities',{name:document.getElementById('communityName').value,category:document.getElementById('communityCategory').value,description:document.getElementById('communityDescription').value,about:document.getElementById('communityAbout').value}).then(function(){S.communityQ='';return loadCommunities();}).then(function(){render(true);toast('Сообщество создано');}).catch(function(e){er.textContent=e.message;});return;
 }
 if(f.id==='newsForm'){
  x.preventDefault();var er=document.getElementById('newsErr');
  api('POST','/api/news',{title:document.getElementById('newsTitle').value,body:document.getElementById('newsBody').value}).then(function(){return loadFeed();}).then(function(){render(true);toast('Новость опубликована');}).catch(function(e){er.textContent=e.message;});return;
 }
 if(f.id==='loginForm'){
  x.preventDefault();
  var em=document.getElementById('lEmail').value.trim(),er=document.getElementById('lErr');
  var sid=document.getElementById('lSid').value.trim();
  if(!em&&!sid){er.textContent='Введите почту или номер студенческого билета.';return;}
  if(em&&!/^\S+@\S+\.\S{2,}$/.test(em)){er.textContent='Введите корректную почту.';return;}
  if(!document.getElementById('lAgree').checked){er.textContent='Нужно согласие на обработку персональных данных.';return;}
  var b=document.getElementById('lBtn');b.disabled=true;er.textContent='';
  api('POST','/api/register',{email:em,sid:sid,name:document.getElementById('lName').value.trim(),course:+document.getElementById('lCourse').value,code:document.getElementById('lCode').value}).then(function(d){
   setTok(d.token);setIdent({email:em,sid:sid,name:document.getElementById('lName').value.trim(),course:+document.getElementById('lCourse').value});S.user=d.user;return loadEvents();
  }).then(function(){return loadFeed();}).then(function(){S.view='feed';S.tab='foryou';render();toast('Добро пожаловать в Коннект!');loadStats();loadNotes();}).catch(function(e){b.disabled=false;er.textContent=e.message;if(e.needCode){document.getElementById('lCodeBox').hidden=false;document.getElementById('lCode').focus();}});
  return;
 }
 if(f.dataset&&f.dataset.chat!==undefined){
  x.preventDefault();
  var inp=document.getElementById('cIn'),v=inp.value.trim();if(!v)return;
  var key=f.dataset.chat==='general'?'general':+f.dataset.chat;
  inp.value='';
  api('POST','/api/chats/'+key+'/messages',{t:v}).then(function(d){
   var c=C[key]=C[key]||{l:[],last:0};
   if(!c.l.some(function(m){return m.id===d.message.id;})){c.l.push(d.message);c.last=Math.max(c.last,d.message.id);}
   paintMsgs(key,true);
  }).catch(function(e){inp.value=v;fail(e);});
  inp.focus();
 }
});

/* ---------- опрос сервера ---------- */
var tick=0;
setInterval(function(){
 tick++;
 if(document.hidden)return;
 var k=S.user?curKey():null;
 if(k!=null)fetchChat(k).catch(function(){});
 if(tick%4===0){
  loadNotes();loadStats().then(function(){if(!S.user&&S.view==='login'){var p=document.querySelector('.pill.cream');if(p&&S.stats)p.textContent=S.stats.demo?'Реальных студентов: '+S.stats.users+' · демо-профилей: '+S.stats.demo:'Уже с нами: '+S.stats.users;}});
  if(S.user){
   var typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
   loadEvents().then(function(ch){if(ch&&!typing&&(S.view==='feed'||S.view==='chats'||S.view==='event'))render(true);}).catch(function(){});
   if(isMod()&&S.view==='admin'&&!typing)loadAdmin();
  }
 }
},2500);

/* ---------- запуск ---------- */
loadStats().then(function(){if(!S.user&&S.view==='login')render();});
if(getTok()){
 api('GET','/api/me').then(function(d){S.user=d.user;return loadFeed();}).then(function(){S.view='feed';render();loadNotes();}).catch(function(er){if(er.status===401)setTok('');render();});
}else render();
})();
</script>
</body>
</html>
